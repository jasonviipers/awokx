name: CI and Cloudflare deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install dashboard dependencies
        run: bun install --frozen-lockfile
        working-directory: dashboard

      - name: Audit dependencies and unused modules
        run: |
          bun run audit:unused
          bun audit
          cd dashboard
          bun audit

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test:run

      - name: Build dashboard
        run: bun run build
        working-directory: dashboard

      - name: Check formatting and linting
        run: bun run check

      - name: Verify Worker deployment bundle
        run: bunx wrangler deploy --config wrangler.deploy.json --dry-run --outdir .wrangler/ci-build

      - name: Save tested dashboard build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    concurrency:
      group: cloudflare-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://viipers.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore tested dashboard build
        uses: actions/download-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist

      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
            exit 1
          fi

      - name: Apply pending database migrations
        run: bun run db:migrate:remote

      - name: Deploy to Cloudflare
        run: bun run deploy

      - name: Verify production health
        run: |
          for i in $(seq 1 8); do
            if curl --silent --show-error --max-time 15 https://viipers.com/health \
              | jq --exit-status '.status == "ok"' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::https://viipers.com/health did not return {\"status\":\"ok\"}"
          curl --silent --show-error --max-time 15 https://viipers.com/health || true
          exit 1
